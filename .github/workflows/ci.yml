name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (default features)
        run: cargo build --target ${{ matrix.target }} --release

      - name: Build (FFI)
        run: cargo build --target ${{ matrix.target }} --release --features ffi

      - name: Check (no_std)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo rustc --target ${{ matrix.target }} --features no_std --crate-type lib

      - name: Run tests
        run: cargo test --target ${{ matrix.target }} --release

      - name: Upload library artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portablegl-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/libportablegl.a
            target/${{ matrix.target }}/release/libportablegl.so
            target/${{ matrix.target }}/release/libportablegl.dylib
            target/${{ matrix.target }}/release/portablegl.dll
            target/${{ matrix.target }}/release/portablegl.dll.lib
            target/${{ matrix.target }}/release/portablegl.lib
          if-no-files-found: ignore

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release (default)
        run: cargo build --target ${{ matrix.target }} --release

      - name: Build release (FFI)
        run: cargo build --target ${{ matrix.target }} --release --features ffi

      - name: Run tests
        run: cargo test --target ${{ matrix.target }} --release

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/libportablegl.a dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/libportablegl.so dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/libportablegl.dylib dist/ 2>/dev/null || true
          cp LICENSE README.md dist/
          cd dist && tar czf ../portablegl-${{ github.ref_name }}-${{ matrix.target }}.tar.gz *

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/portablegl.dll dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/portablegl.dll.lib dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/portablegl.lib dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/libportablegl.a dist/ 2>/dev/null || true
          cp LICENSE README.md dist/
          cd dist && 7z a ../portablegl-${{ github.ref_name }}-${{ matrix.target }}.zip *

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: portablegl-${{ matrix.target }}
          path: portablegl-${{ github.ref_name }}-${{ matrix.target }}.*

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

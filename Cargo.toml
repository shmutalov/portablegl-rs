[package]
name = "portablegl"
version = "0.6.0"
edition = "2021"
description = "A pure Rust software implementation of OpenGL 3.x core profile, ported from PortableGL"
license = "MIT"
repository = "https://github.com/shmutalov/portablegl-rs"
keywords = ["opengl", "software-renderer", "graphics", "no-std", "rasterization"]
categories = ["graphics", "rendering", "no-std"]
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
libm = { version = "0.2", optional = true }
sdl2 = { version = "0.37", optional = true }

[features]
default = ["abgr32", "d24s8"]

# Pixel formats (choose one)
abgr32 = []
rgba32 = []
argb32 = []
bgra32 = []
rgb565 = []
bgr565 = []

# Depth/stencil formats (choose one)
d24s8 = []
d16 = []
no_depth = []

# no_std support (requires alloc)
no_std = ["dep:libm"]

# Optional features
no_stencil = []
unsafe_mode = []
disable_color_mask = []
hermite_smoothing = []
better_thick_lines = []
ffi = []
examples = ["dep:sdl2"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[dev-dependencies]
png = "0.17"

[[example]]
name = "hello_triangle"
path = "examples/hello_triangle.rs"
required-features = ["examples"]

[[example]]
name = "colored_triangle"
path = "examples/colored_triangle.rs"
required-features = ["examples"]

[[example]]
name = "spinning_triangle"
path = "examples/spinning_triangle.rs"
required-features = ["examples"]

[[example]]
name = "perf_tests"
path = "examples/perf_tests.rs"
required-features = ["examples"]
